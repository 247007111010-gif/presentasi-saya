<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentasi Saya</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      overflow: hidden;
    }

    .slide {
      width: 100vw;
      height: 100vh;
      display: none;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 50px;
    }

    .slide.active {
      display: flex;
    }

    .content {
      max-width: 900px;
    }

    h1 {
      font-size: 60px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 45px;
      margin-bottom: 25px;
    }

    p {
      font-size: 24px;
      line-height: 1.6;
    }

    button {
      position: fixed;
      bottom: 30px;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #prev {
      left: 30px;
    }

    #next {
      right: 30px;
    }

    #counter {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
    }
  </style>
</head>

<body>

  <!-- SLIDE 1 -->
  <section class="slide active">
    <div class="content">
      <h1>Judul Presentasi</h1>
      <p>Nama Kamu</p>
      <p>Kelas / Mata Pelajaran</p>
    </div>
  </section>

  <!-- SLIDE 2 -->
  <section class="slide">
    <div class="content">
      <h2>Latar Belakang</h2>
      <p>
        Tulis latar belakang materi presentasi kamu di sini.
      </p>
    </div>
  </section>

  <!-- SLIDE 3 -->
  <section class="slide">
    <div class="content">
      <h2>Pembahasan</h2>
      <p>
        Tulis isi atau materi utama presentasi kamu di sini.
      </p>
    </div>
  </section>

  <!-- SLIDE 4 -->
  <section class="slide">
    <div class="content">
      <h2>Kesimpulan</h2>
      <p>
        Tulis kesimpulan presentasi kamu di sini.
      </p>
    </div>
  </section>

  <button id="prev" onclick="prevSlide()">← Sebelumnya</button>
  <button id="next" onclick="nextSlide()">Berikutnya →</button>

  <div id="counter">1 / 4</div>

  <script>
    const slides = document.querySelectorAll(".slide");
    let current = 0;

    function showSlide(index) {
      slides.forEach(slide => {
        slide.classList.remove("active");
      });

      slides[index].classList.add("active");

      document.getElementById("counter").textContent =
        (index + 1) + " / " + slides.length;
    }

    function nextSlide() {
      if (current < slides.length - 1) {
        current++;
        showSlide(current);
      }
    }

    function prevSlide() {
      if (current > 0) {
        current--;
        showSlide(current);
      }
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "ArrowRight") {
        nextSlide();
      }

      if (event.key === "ArrowLeft") {
        prevSlide();
      }
    });
  </script>

</body>
</html>
